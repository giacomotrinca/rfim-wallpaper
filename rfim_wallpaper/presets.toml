# ============================================================
#  RFIM Wallpaper — simulation presets.
#  Edit this file to add/change presets, then:
#      rfim-wallpaper --list-presets
#      rfim-wallpaper --preset NAME
#
#  Parameters:
#    mode        = thermal (finite-T Metropolis) | avalanche (T=0 field ramp)
#    disorder    = Δ, std of the quenched field h_i ~ N(0,Δ). 0 = clean Ising.
#    temperature = T in units of J (thermal only). T_c ≈ 2.269.
#    field       = uniform external field H_ext (thermal only).
#    sweeps      = Monte Carlo sweeps (thermal only).
#    ramp_steps  = field-ramp steps (avalanche only).
#    target_m    = target magnetization (avalanche only, 0 = coercive).
# ============================================================

[pulito]
mode = "thermal"
temperature = 2.269
disorder = 0.0
sweeps = 2000

[fumo]
mode = "thermal"
temperature = 1.6
disorder = 0.2
sweeps = 2000

[braci]
mode = "avalanche"
disorder = 1.25
ramp_steps = 256
target_m = 0.0

[crackle]
mode = "avalanche"
disorder = 1.5
ramp_steps = 256
target_m = 0.0

[caos]
mode = "avalanche"
disorder = 3.0
ramp_steps = 256
target_m = 0.0
