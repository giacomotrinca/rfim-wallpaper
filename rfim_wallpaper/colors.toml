# ============================================================
#  RFIM Wallpaper — color themes.
#  Edit this file to add/change themes, then:
#      rfim-wallpaper --list-colors
#      rfim-wallpaper --colors NAME[,NAME...]
#
#  Roles:
#    background   = dark base (espresso-like)
#    surface_dim  = recessed surfaces (used by the "material" style)
#    accent       = primary voice (domain walls / main texture)
#    accent_dim   = dimmed accent (used by the "material" style)
#    accent_hi    = hot-spot highlight (junctions / peaks)
# ============================================================

